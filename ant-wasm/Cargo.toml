[package]
name = "ant-wasm"
version = "0.1.0"
edition = "2021"
description = "Browser WASM client for downloading data from the Autonomi network via WebTransport"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ant-protocol = { path = "../ant-protocol" }
self_encryption = { path = "../self_encryption", default-features = false }
bincode = "~1.3.3"
blake3 = "1"
bytes = "1"
chacha20poly1305 = "0.10"
fips203 = { version = "0.4", default-features = false, features = ["ml-kem-768"] }
fips204 = { version = "0.4", default-features = false, features = ["ml-dsa-65"] }
getrandom = { version = "0.2", features = ["js"] }
zeroize = "1"
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
js-sys = "0.3"
lru = "0.12"
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "WebTransport",
    "WebTransportBidirectionalStream",
    "WebTransportHash",
    "WebTransportOptions",
    "WebTransportReceiveStream",
    "WebTransportSendStream",
    "WritableStream",
    "WritableStreamDefaultWriter",
]

[dev-dependencies]
wasm-bindgen-test = "0.3"
