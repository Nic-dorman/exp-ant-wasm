[package]
name = "ant-protocol"
version = "0.1.0"
edition = "2021"
description = "WASM-compatible protocol types for the Autonomi chunk protocol"

[dependencies]
blake3 = "1"
bytes = "1"
hex = "0.4"
postcard = { version = "1.1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
ant-node = "0.9.0"
